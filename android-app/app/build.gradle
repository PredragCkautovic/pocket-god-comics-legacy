plugins { id 'com.android.application' }

android {
    namespace 'com.pocketgod.comics.modern'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pocketgod.comics.modern'
        minSdk 23
        targetSdk 35
        versionCode 301
        versionName '3.0.1'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions {
        noCompress 'jpg', 'jpeg', 'png', 'gif'
    }
}
