plugins { id 'com.android.application' }

android {
    namespace 'com.pocketgod.comics.modern'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pocketgod.comics.modern'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions {
        noCompress 'jpg', 'jpeg', 'png', 'gif'
    }
}
