name: Android iOS-Parity Reader APK

'on':
  push:
    branches:
      - modern-3.0.0-rc1-ci
    paths:
      - "android-app/**"
      - ".github/workflows/android-ios-parity-linux.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-parity:
    name: Native Android with verified iVerse source assets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Download validated iOS asset archive
        uses: actions/download-artifact@v4
        with:
          name: Pocket_God_Comics_Modern_3.0.0_RC1_TEST
          run-id: 41470739056
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: PredragCkautovic/pocket-god-comics-legacy
          path: ios-cache

      - name: Extract canonical original comic bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          ipa=Path("ios-cache/Pocket_God_Comics_Modern_3.0.0_RC1_TEST.ipa")
          assert ipa.is_file(), "Missing validated source IPA"
          app="Payload/PocketGodComics.app/"
          dest=Path("android-app/app/src/main/assets")
          dest.mkdir(parents=True,exist_ok=True)
          with ZipFile(ipa) as z:
              assert z.testzip() is None
              catalog=json.loads(z.read(app+"native_catalog.json"))
              assert len(catalog)==25 and sum(len(i["pages"]) for i in catalog)==654
              (dest/"native_catalog.json").write_bytes(z.read(app+"native_catalog.json"))
              images=set()
              for item in catalog:
                  images.update(item["pages"])
              for path in images:
                  filename=app+"web/"+path
                  data=z.read(filename)
                  target=dest/"web"/path
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
              for name in z.namelist():
                  if name.startswith(app+"web/assets/ipa_original/") and not name.endswith("/"):
                      target=dest/name[len(app):]
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(name))
          print("Verified original 25 issues / 654 pages, extracted",len(images),"media files")
          PY

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK from Linux image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Validate offline Android APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          apk=Path("android-app/app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size>1000000
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              data=json.loads(z.read("assets/native_catalog.json"))
              assert len(data)==25
              assert sum(len(i["pages"]) for i in data)==654
              assert all("assets/web/"+p in names for i in data for p in i["pages"])
              assert "classes.dex" in names
              assert "AndroidManifest.xml" in names
              for asset in ("shelf_icon@2x.png","list_icon@2x.png","bookmark@2x.png","single_page_spread_white@2x.png","two_page_spread_white@2x.png"):
                  assert "assets/web/assets/ipa_original/"+asset in names,asset
          print("ANDROID_UI_PARITY_BUILD_PASS", apk.stat().st_size, hashlib.sha256(apk.read_bytes()).hexdigest())
          PY

      - name: Upload iOS-parity APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket_God_Comics_Android_iOS_Parity_TEST
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
