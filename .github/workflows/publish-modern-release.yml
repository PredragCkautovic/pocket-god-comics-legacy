name: Publish Pocket God Comics iOS and Android

'on':
  push:
    branches:
      - modern-3.0.0-rc1-ci
    paths:
      - .github/workflows/publish-modern-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Release the two device-tested binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get verified iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: Pocket_God_Comics_Modern_3.0.0_RC1_TEST
          run-id: 41484146114
          repository: PredragCkautovic/pocket-god-comics-legacy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ios-build

      - name: Get verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: Pocket_God_Comics_Android_iOS_Parity_TEST
          run-id: 41484313305
          repository: PredragCkautovic/pocket-god-comics-legacy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android-build

      - name: Verify original binaries and give them release filenames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, plistlib, shutil, zipfile

          ipa = Path("ios-build/Pocket_God_Comics_Modern_3.0.0_RC1_TEST.ipa")
          apk = Path("android-build/app-debug.apk")
          expected = {
              "ios": ("c01b1c5a1ab070eb654d6d57e1890b2587d8539554bea5bb55ec21cb313075b7", 187124893),
              "android": ("e77be32a6f920c0977a64cb74912957171cf778a0835ef55cdf7c8cbc11b37a1", 187843116),
          }
          for platform, path in (("ios",ipa),("android",apk)):
              assert path.is_file(), f"Missing {platform} binary: {path}"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sha, size = expected[platform]
              assert digest == sha and path.stat().st_size == size, (
                  f"{platform}: digest or file size differs from the device-tested binary"
              )
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None, f"{platform}: ZIP integrity failed"
                  if platform == "ios":
                      prefix = "Payload/PocketGodComics.app/"
                      info = plistlib.loads(z.read(prefix+"Info.plist"))
                      assert info["UIDeviceFamily"] == [1,2]
                      catalog = json.loads(z.read(prefix+"native_catalog.json"))
                      assert len(catalog) == 25 and sum(len(item["pages"]) for item in catalog) == 654
                      assert all(prefix+"web/"+p in z.namelist() for item in catalog for p in item["pages"])
                  else:
                      names = set(z.namelist())
                      assert "classes.dex" in names and "AndroidManifest.xml" in names
                      catalog = json.loads(z.read("assets/native_catalog.json"))
                      assert len(catalog) == 25 and sum(len(item["pages"]) for item in catalog) == 654
                      for item in catalog:
                          assert "assets/web/"+item["thumbnail"] in names, "Missing Android cover"
                          assert "assets/web/"+item["cover"] in names, "Missing Android cover fallback"
                          assert all("assets/web/"+p in names for p in item["pages"])
              print(f"VERIFIED {platform}: {size} bytes sha256={digest}")
          out = Path("publish")
          out.mkdir(exist_ok=True)
          shutil.copy2(ipa,out/"Pocket God Comics.ipa")
          shutil.copy2(apk,out/"Pocket God Comics.apk")
          assert sorted(x.name for x in out.iterdir()) == [
              "Pocket God Comics.apk", "Pocket God Comics.ipa"
          ]
          print("READY: exactly two verified release assets")
          PY

      - name: Prepare release description
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Pocket God Comics for modern iOS and Android.

          Both versions include the offline 25-issue collection (654 pages), the classic My Comics bookshelf, fullscreen reader, search, bookmarks, reading progress, and CBZ imports. The Pocket God banner has been removed so the comic library uses the full screen. Android includes the corrected original cover art.

          **Downloads**
          - **Pocket God Comics.ipa** — native 64-bit iPhone/iPad app (iOS 12+). Install through a compatible signing or sideloading method.
          - **Pocket God Comics.apk** — native Android app (Android 6+). Download and install the APK.

          Older debug-signed Android builds may have a different signature. Back up imported comics and reading progress before reinstalling.

          The original legacy iOS release remains available separately. This is an unofficial preservation project, not affiliated with the original rights holders.
          EOF

      - name: Publish or update the modern GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=modern-v3.0.0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               "publish/Pocket God Comics.ipa"               "publish/Pocket God Comics.apk"               --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY"               --title "Pocket God Comics — iOS & Android"               --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG"               "publish/Pocket God Comics.ipa"               "publish/Pocket God Comics.apk"               --repo "$GITHUB_REPOSITORY"               --target main               --title "Pocket God Comics — iOS & Android"               --notes-file /tmp/release-notes.md
          fi

      - name: Confirm exactly two assets are public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          raw=subprocess.check_output(["gh","api",f"repos/{repo}/releases/tags/modern-v3.0.0"])
          data=json.loads(raw)
          assets=data["assets"]
          names=sorted(item["name"] for item in assets)
          # GitHub Release assets normalize spaces into dots on upload.
          assert names==["Pocket.God.Comics.apk","Pocket.God.Comics.ipa"],names
          expected_bytes={"Pocket.God.Comics.apk":187843116,"Pocket.God.Comics.ipa":187124893}
          for item in assets:
              assert item["state"]=="uploaded" and item["size"]==expected_bytes[item["name"]]
              print("PUBLISHED",item["name"],item["size"],item["browser_download_url"])
          print("RELEASE",data["html_url"])
          PY
